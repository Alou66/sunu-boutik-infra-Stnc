# OBSOLÈTE — ancien déploiement sur une seule EC2, conservé pour référence.
# Ne pas utiliser en production : voir legacy/README.md et ansible/DEPLOYMENT.md.

# Reverse proxy Nginx pour Sunu Boutik, installé sur l'hôte EC2 (hors
# Docker). À copier vers /etc/nginx/sites-available/sunu-boutik sur le
# serveur, puis activer avec :
#   sudo ln -s /etc/nginx/sites-available/sunu-boutik /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Les containers api/web publient leurs ports sur 0.0.0.0 (voir
# docker-compose.yml), mais le Security Group EC2 ne doit autoriser que
# 22 (SSH), 80 (HTTP) et 443 (HTTPS) depuis l'extérieur : 3000/8000/5432
# restent donc injoignables depuis Internet, seul ce Nginx local peut les
# atteindre via 127.0.0.1.
#
# Étape 2/2 HTTPS : certificat Let's Encrypt émis pour sunu-boutique.online
# (voir README). Le port 80 ne sert plus que le challenge ACME (pour le
# renouvellement automatique par certbot.timer) et redirige tout le reste
# vers HTTPS ; le port 443 sert l'application.

server {
    listen 80;
    listen [::]:80;
    server_name sunu-boutique.online www.sunu-boutique.online;

    # Challenge ACME pour l'émission/le renouvellement du certificat Let's
    # Encrypt (voir `certbot certonly --webroot -w /var/www/certbot`).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sunu-boutique.online www.sunu-boutique.online;

    client_max_body_size 20M;

    ssl_certificate /etc/letsencrypt/live/sunu-boutique.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunu-boutique.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # API FastAPI, exposée sous /api/ (préfixe retiré avant transmission :
    # NEXT_PUBLIC_API_URL doit donc valoir https://sunu-boutique.online/api
    # côté build web).
    location /api/ {
        proxy_pass http://{{ backend_private_ip }}:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
