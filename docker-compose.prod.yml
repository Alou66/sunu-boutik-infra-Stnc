name: sunu-boutik

# Compose de production : utilisé sur le serveur EC2, déployé automatiquement
# par les workflows GitHub Actions (voir .github/workflows/ dans les 3
# repos). Contrairement à docker-compose.yml (dev local), les services
# api/web pointent vers des images déjà construites et poussées sur GHCR par
# la CI — aucun `build:` ici, donc aucune compilation sur le serveur (utile
# vu la RAM limitée de l'instance).
#
# Utilisation manuelle si besoin :
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --wait

services:
  db:
    image: postgres:16-alpine
    container_name: sunu-boutik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sunu-boutik-network
    # Pas de port publié : seuls les containers du réseau interne (api) ont
    # besoin de joindre Postgres. En dev (docker-compose.yml), le port est
    # publié pour permettre la connexion depuis un client SQL sur la machine.

  api:
    image: ghcr.io/alou66/sunu-boutik-api-stnc:latest
    container_name: sunu-boutik-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      # Publié uniquement sur localhost : Nginx (hôte) est le seul point
      # d'entrée public, voir deploy/nginx.conf.
      - "127.0.0.1:8000:8000"
    volumes:
      - api_uploads:/app/uploads
    networks:
      - sunu-boutik-network

  web:
    image: ghcr.io/alou66/sunu-boutik-web-stnc:latest
    container_name: sunu-boutik-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - sunu-boutik-network

volumes:
  postgres_data:
    name: sunu-boutik-postgres-data
  api_uploads:
    name: sunu-boutik-api-uploads

networks:
  sunu-boutik-network:
    name: sunu-boutik-network
    driver: bridge
