---
- name: Vérification des variables du reverse proxy
  ansible.builtin.assert:
    that:
      - nginx_backend_host | length > 0
      - nginx_backend_host is match('^(\d{1,3}\.){3}\d{1,3}$')
      - nginx_server_name | length > 0
    fail_msg: >-
      backend_private_ip doit contenir l'IP privée du backend (actuellement :
      '{{ nginx_backend_host }}'). Voir scripts/generate_inventory.sh.
    quiet: true

- name: Installation Nginx et Certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
    state: present
    update_cache: true

- name: Version de Nginx
  ansible.builtin.command: nginx -v
  register: nginx_version_cmd
  changed_when: false
  # Lecture seule : nécessaire aussi en --check pour choisir la syntaxe.
  check_mode: false

# `http2 on;` n'existe qu'à partir de Nginx 1.25.1 ; Ubuntu 24.04 fournit
# 1.24, qui attend l'ancienne syntaxe `listen 443 ssl http2;`.
- name: Détection de la syntaxe HTTP/2
  ansible.builtin.set_fact:
    nginx_version: "{{ nginx_version_cmd.stderr | regex_search('nginx/([0-9.]+)', '\\1') | first }}"

- name: Répertoire webroot du challenge ACME
  ansible.builtin.file:
    path: "{{ nginx_certbot_webroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Suppression site par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Démarrage et activation Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Configuration du site (HTTPS si le certificat existe déjà)
  ansible.builtin.include_tasks: site.yml

- name: Première émission du certificat Let's Encrypt
  when:
    - nginx_certbot_enabled | bool
    - not nginx_https_enabled | bool
  block:
    - name: Email Let's Encrypt renseigné
      ansible.builtin.assert:
        that:
          - nginx_certbot_email is match('^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$')
          - not nginx_certbot_email is search('@example\.(com|org|net)$')
        fail_msg: >-
          nginx_certbot_email (inventory/group_vars/frontend.yml) doit être une
          adresse réelle (pas example.com) pour émettre le certificat. Le site
          reste en HTTP seul tant qu'il n'est pas défini (ou passer
          nginx_certbot_enabled=false pour ne pas tenter l'émission).
        quiet: true

    # Prérequis : les enregistrements DNS A des domaines pointent déjà vers
    # l'IP publique de cet hôte et le port 80 est ouvert dans le SG.
    - name: Émission du certificat (webroot)
      ansible.builtin.command:
        cmd: >-
          certbot certonly --webroot
          -w {{ nginx_certbot_webroot | quote }}
          --cert-name {{ nginx_server_name | quote }}
          -d {{ ([nginx_server_name] + nginx_server_aliases) | join(',') | quote }}
          --email {{ nginx_certbot_email | quote }}
          --agree-tos --non-interactive --keep-until-expiring
          {{ '--staging' if nginx_certbot_staging | bool else '' }}
        creates: "{{ nginx_ssl_certificate }}"

    - name: Bascule du site en HTTPS
      ansible.builtin.include_tasks: site.yml

# Renouvellement : le paquet certbot installe certbot.timer (2 passages par
# jour). La méthode webroot est mémorisée dans
# /etc/letsencrypt/renewal/<domaine>.conf ; ce hook recharge Nginx après
# chaque renouvellement réussi, uniquement si la config est valide.
- name: Répertoire des hooks de renouvellement
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Hook de rechargement Nginx après renouvellement
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Géré par Ansible (rôle nginx).
      nginx -t && systemctl reload nginx

- name: Renouvellement automatique (certbot.timer)
  ansible.builtin.systemd_service:
    name: certbot.timer
    state: started
    enabled: true
