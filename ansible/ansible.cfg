[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
retry_files_enabled = False
roles_path = roles
# Collections installées dans le répertoire utilisateur via
# ansible/requirements.yml ; le paquet Ansible complet du système n'est pas
# consulté, pour garantir que seules les versions épinglées sont utilisées.
collections_path = ~/.ansible/collections
collections_scan_sys_path = False
vault_password_file = ~/.config/ansible/vault-pass
