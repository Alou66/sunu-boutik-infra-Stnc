# Reverse proxy Nginx pour Sunu Boutik, installé sur l'hôte EC2 (hors
# Docker). À copier vers /etc/nginx/sites-available/sunu-boutik sur le
# serveur, puis activer avec :
#   sudo ln -s /etc/nginx/sites-available/sunu-boutik /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Les containers api/web publient leurs ports sur 0.0.0.0 (voir
# docker-compose.yml), mais le Security Group EC2 ne doit autoriser que
# 22 (SSH) et 80 (HTTP) depuis l'extérieur : 3000/8000/5432 restent donc
# injoignables depuis Internet, seul ce Nginx local peut les atteindre via
# 127.0.0.1.
#
# Étape 1/2 HTTPS : ce fichier ajoute uniquement le webroot ACME nécessaire
# à `certbot certonly --webroot` pour obtenir le certificat Let's Encrypt de
# sunu-boutique.online. Une fois le certificat obtenu (voir README), une
# 2e modification ajoutera le bloc `server { listen 443 ssl; ... }` et la
# redirection HTTP -> HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name sunu-boutique.online www.sunu-boutique.online;

    client_max_body_size 20M;

    # Challenge ACME pour l'émission/le renouvellement du certificat Let's
    # Encrypt (voir `certbot certonly --webroot -w /var/www/certbot`).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API FastAPI, exposée sous /api/ (préfixe retiré avant transmission :
    # NEXT_PUBLIC_API_URL doit donc valoir http://<IP>/api côté build web).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
